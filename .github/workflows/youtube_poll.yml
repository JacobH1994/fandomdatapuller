name: YouTube live-viewership poll

# Deliberately a completely separate workflow file from poll.yml (the
# Twitch collector) — CLAUDE.md's "one rule" (never risk the Twitch
# collector, even briefly) rules out any shared trigger/job/step that
# could let a YouTube-side failure affect Twitch collection.

on:
  schedule:
    # Hourly, on the hour, UTC — same cadence as poll.yml, though the
    # script itself only does an expensive discovery sweep a few times a
    # day by default (see collectors/youtube_poll.py's own docstring);
    # every hourly invocation still does a cheap refresh of whatever's
    # already known live.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      titles:
        description: "Comma-separated title ids to check (default: all with configured channels)"
        required: false
        default: ""
      sweep:
        description: "Force a discovery sweep this run (recommended once for a specific tournament's start)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: youtube-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TITLES="${{ github.event.inputs.titles }}"
          SWEEP="${{ github.event.inputs.sweep }}"

          ARGS=()
          if [ -n "$TITLES" ]; then
            ARGS+=(--titles "$TITLES")
          fi
          if [ "$SWEEP" = "true" ]; then
            ARGS+=(--sweep)
          fi

          # Captured, not `set -e`-aborted: even a partial/failed run still
          # writes a raw file worth committing (irreplaceable data, same
          # reasoning as poll.yml's own || overall_status=1 pattern) — a
          # collector failure should surface as a failed job at the end,
          # not skip the commit of whatever it did manage to collect.
          overall_status=0
          python collectors/youtube_poll.py "${ARGS[@]}" || overall_status=1

          # `git add` on a path with nothing under it yet (e.g. a clean
          # no-channels-curated no-op — no snapshot gets written in that
          # case, so the directory never gets created) fails outright and,
          # under set -e, kills the job before it reaches `exit
          # $overall_status` below — a spurious failure with no real
          # collector problem behind it. Confirmed live 2026-09-08: this
          # fired every scheduled run while config/channels_youtube.yaml
          # was still empty.
          if [ -d data/raw/youtube ]; then
            git add data/raw/youtube
          fi
          if ! git diff --cached --quiet; then
            git commit -m "YouTube snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Confirmed live 2026-09-09 (poll.yml, steam_poll.yml,
            # steam_discovery_poll.yml): with five scheduled collector
            # workflows now pushing to main on similar cadences, two can
            # race and one gets rejected — under set -e that kills the
            # job before this point, discarding a commit that only ever
            # existed on the now-destroyed ephemeral runner. fetch+
            # rebase+retry is standard practice for exactly this — safe
            # here specifically because every collector writes to its
            # own distinct data/raw/<platform>/ subtree, so a concurrent
            # commit from another workflow never conflicts at the
            # content level, only at the ref-update level.
            attempt=1
            until git push; do
              if [ "$attempt" -ge 5 ]; then
                echo "[error] push failed after 5 attempts"
                overall_status=1
                break
              fi
              echo "[warn] push attempt $attempt failed -- fetching + rebasing before retry"
              git fetch origin main
              git rebase origin/main
              attempt=$((attempt + 1))
              sleep $((attempt * 2))
            done
          fi

          exit $overall_status
