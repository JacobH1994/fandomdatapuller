name: Steam player-count poll

# Deliberately a completely separate workflow file from poll.yml (Twitch)
# and youtube_poll.yml — CLAUDE.md's "one rule" (now covering all three
# live collectors) rules out any shared trigger/job/step that could let
# one platform's failure affect another's collection.

on:
  schedule:
    # Hourly, on the hour, UTC — same cadence as the other two collectors.
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      titles:
        description: "Comma-separated title ids to check (default: all in config/steam_appids.yaml)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: steam-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll Steam
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TITLES="${{ github.event.inputs.titles }}"

          ARGS=()
          if [ -n "$TITLES" ]; then
            ARGS+=(--titles "$TITLES")
          fi

          # Captured, not `set -e`-aborted -- same reasoning as
          # youtube_poll.yml: a partial/failed run still writes a raw
          # file worth committing.
          overall_status=0
          python collectors/steam_poll.py "${ARGS[@]}" || overall_status=1

          # Same defensive check as youtube_poll.yml: `git add` on a path
          # with nothing under it yet fails outright and, under set -e,
          # kills the job before `exit $overall_status` below. Not
          # currently reachable (config/steam_appids.yaml ships
          # pre-populated, so a snapshot always gets written), but kept
          # consistent in case that config is ever emptied.
          if [ -d data/raw/steam ]; then
            git add data/raw/steam
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Steam snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Confirmed live 2026-09-08: with multiple scheduled collector
            # workflows now pushing to main on similar cadences, two can
            # race and one gets rejected ("fatal error in commit_refs") --
            # this exact run lost one full 11-title poll to it. fetch+
            # rebase+retry is standard practice for exactly this -- safe
            # here since every collector writes to its own distinct
            # data/raw/<platform>/ subtree, so a concurrent commit from
            # another workflow never conflicts at the content level, only
            # at the ref-update level.
            attempt=1
            until git push; do
              if [ "$attempt" -ge 5 ]; then
                echo "[error] push failed after 5 attempts"
                overall_status=1
                break
              fi
              echo "[warn] push attempt $attempt failed -- fetching + rebasing before retry"
              git fetch origin main
              git rebase origin/main
              attempt=$((attempt + 1))
              sleep $((attempt * 2))
            done
          fi

          exit $overall_status
