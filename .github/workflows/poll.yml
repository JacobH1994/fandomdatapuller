name: Twitch live-viewership poll

on:
  schedule:
    # Hourly, on the hour, UTC (PRD §9.1 default cadence).
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      titles:
        description: "Comma-separated title ids to poll (default: all active titles in config/titles.yaml)"
        required: false
        default: ""
      duration_minutes:
        description: "Event mode: keep polling for this many minutes (0 = single poll)"
        required: false
        default: "0"
      interval_minutes:
        description: "Event mode: minutes between polls"
        required: false
        default: "5"
      skip_platform_totals:
        description: "Skip the platform-wide total pagination (recommended for tight event-mode intervals, e.g. interval_minutes below ~10 — a full pagination run takes several minutes on its own). Leave false for a normal single poll."
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: twitch-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll Twitch (loop when in event mode)
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TITLES="${{ github.event.inputs.titles }}"
          DURATION="${{ github.event.inputs.duration_minutes }}"
          INTERVAL="${{ github.event.inputs.interval_minutes }}"
          SKIP_TOTALS="${{ github.event.inputs.skip_platform_totals }}"
          DURATION="${DURATION:-0}"
          INTERVAL="${INTERVAL:-5}"
          # github.event.inputs is only populated for workflow_dispatch —
          # a schedule-triggered run (the hourly cron this workflow exists
          # for) has no inputs object at all, so SKIP_TOTALS is always
          # empty here and this fallback is what actually governs it.
          # Was ":-true" until 2026-09-07: that silently skipped the
          # whole-platform pagination on every single scheduled run since
          # collection began, so platform_totals had essentially one real
          # data point despite the collector running hourly for a week —
          # a real, unrecoverable Phase 1 collection gap (that denominator
          # can't be backfilled any more than viewership_snapshots can).
          # Confirmed live before flipping this: a full pagination run
          # (~815 pages at current channel counts) takes under 5 minutes,
          # comfortably inside the hourly window — not a collector-cadence
          # risk. See docs/system_reference.md for what this fed into.
          SKIP_TOTALS="${SKIP_TOTALS:-false}"

          ARGS=()
          if [ -n "$TITLES" ]; then
            ARGS+=(--titles "$TITLES")
          fi
          if [ "$SKIP_TOTALS" = "true" ]; then
            ARGS+=(--skip-platform-totals)
          fi

          # Confirmed live 2026-09-09: with five scheduled collector
          # workflows now pushing to main on similar cadences, two can
          # race and one gets rejected ("fetch first" / "fatal error in
          # commit_refs") — under set -e that killed the whole job before
          # this point, discarding a commit that only ever existed on the
          # now-destroyed ephemeral runner (confirmed: one Steam poll and
          # one Steam discovery run, the latter losing ~25 minutes/1,021
          # apps of real crawl work). fetch+rebase+retry is standard
          # practice for exactly this — safe here specifically because
          # every collector writes to its own distinct data/raw/<platform>/
          # subtree, so a concurrent commit from another workflow never
          # conflicts at the content level, only at the ref-update level.
          push_with_retry() {
            local max_attempts=5 attempt=1
            while [ "$attempt" -le "$max_attempts" ]; do
              if git push; then
                return 0
              fi
              echo "[warn] push attempt $attempt failed -- fetching + rebasing before retry"
              git fetch origin main
              git rebase origin/main
              attempt=$((attempt + 1))
              sleep $((attempt * 2))
            done
            echo "[error] push failed after $max_attempts attempts"
            return 1
          }

          end_time=$(( $(date +%s) + DURATION * 60 ))
          overall_status=0
          while true; do
            python collectors/twitch_poll.py "${ARGS[@]}" || overall_status=1

            git add data/raw
            if ! git diff --cached --quiet; then
              git commit -m "Twitch snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              push_with_retry || overall_status=1
            fi

            if [ "$DURATION" -le 0 ] || [ "$(date +%s)" -ge "$end_time" ]; then
              break
            fi
            sleep $(( INTERVAL * 60 ))
          done

          exit $overall_status
