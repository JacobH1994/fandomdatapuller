# Tracked-title registry — the collector's single source of truth for which
# titles to poll on Twitch (PRD §7) and which Liquipedia wiki/categories the
# Liquipedia connector (collectors/liquipedia.py) crawls for tournament data.
#
# Fields:
#   id                    canonical slug, stable identifier used across the project
#   display_name          human-readable name
#   publisher              current publisher/owner (not necessarily original
#                         developer — e.g. Rocket League: Epic Games, not
#                         Psyonix; Mortal Kombat: Warner Bros. Games, not
#                         NetherRealm). Added 2026-09-07 for
#                         notebooks/esports_share_of_twitch.ipynb's
#                         publisher-grouped growth breakdown. Public,
#                         well-known ownership facts, not a judgment call
#                         the way genre/platform are — but Claude-added and
#                         not independently re-verified against each
#                         company's own materials the way twitch_category_id
#                         is, so still spot-check before treating as gospel
#                         for anything higher-stakes than this one notebook.
#                         No downstream code reads this yet (not seeded into
#                         `titles` by etl/db.py) — notebook-only for now.
#   twitch_category_id    Twitch Helix game_id for `Get Streams`. REQUIRED for polling.
#   twitch_category_verified
#                         false until a human has confirmed this ID against the
#                         Twitch API. The collector will still poll unverified
#                         IDs but logs a warning in the run metadata for each
#                         one, since a wrong ID silently returns zero streams
#                         rather than erroring.
#   is_active             whether the Twitch collector polls this title at all
#   liquipedia_wiki       Liquipedia sub-wiki slug (liquipedia.net/<slug>/api.php).
#                         Several games can share one wiki — see liquipedia_category.
#   liquipedia_category   Exact Liquipedia per-game "Competitions" category
#                         name(s) (e.g. "Tekken 8 Competitions"), verified
#                         live against the wiki's own category membership —
#                         NOT a title substring or a guess. Tournament
#                         discovery intersects (the union of, if a list)
#                         this category with the wiki's tier categories
#                         (Tier 1/2, S/A-Tier, ...). null means "no
#                         narrowing needed" — checked live 2026-09-09 for
#                         all 18 titles this was true for at the time (see
#                         docs/system_reference.md); re-check before
#                         leaving a newly-added title's category null.
#                         Only set for the shared fighting-game wiki, which
#                         hosts several games under the same tier categories
#                         with no other split available.
#
#                         A list (not a single string) is how the four
#                         fighting-game titles below implement the
#                         generational-continuity policy (PRD §19, decided
#                         2026-09-09): "fighters" splits every generation of
#                         a franchise into its OWN "<Franchise> <Version>
#                         Competitions" category, with no unifying parent —
#                         unlike counterstrike's dedicated wiki, which
#                         tracks CS 1.6 through CS2 as one continuous entity
#                         with liquipedia_category left null. Listing every
#                         verified generation's category reconstructs that
#                         same continuity here. A true crossover/spin-off
#                         product (its own game, not a version of the
#                         mainline franchise) is deliberately excluded, not
#                         unioned in — flagged inline per title, same as
#                         every other judgment call in this file.
#
#                         This is a Liquipedia/tournament-data-layer policy
#                         only. It does NOT extend to Twitch polling:
#                         Twitch's own category IDs are genuinely separate
#                         per generation (confirmed: Tekken 7/8 are
#                         different Twitch categories, unlike Counter-
#                         Strike's single renamed-in-place category), and
#                         historical viewership under a retired category
#                         can't be backfilled or merged after the fact —
#                         twitch_category_id below still tracks the current
#                         generation only, by necessity, not by choice.
#   genre / platform      reference tags (Phase 3 classification, PRD §18).
#                         Claude-assisted first pass, ai_assisted_unreviewed
#                         until a human reviews it (CLAUDE.md provenance
#                         rule) — seeded into titles.genre_id/platform_id by
#                         etl/db.py:seed_titles_and_aliases, which also
#                         populates the genres/platforms reference tables.
#
#                         Genre taxonomy (10 values, coarser than a
#                         per-title label but not so coarse it erases a real
#                         audience-pool split — see brief §6's own genre
#                         table, which this follows and extends):
#                           moba            lane-based MOBA: LoL/Dota2 (PC)
#                                           and their direct mobile ports
#                                           (Wild Rift, ML:BB)
#                           tac_fps         tactical/grounded shooter: CS,
#                                           VALORANT, Siege ("arguably", per
#                                           brief §6)
#                           hero_shooter    ability/class-based shooter,
#                                           kept split from tac_fps per
#                                           brief §6 (Overwatch only —
#                                           deliberately a singleton, the
#                                           brief's own "cleanest single-
#                                           niche case")
#                           battle_royale   PUBG/Apex/Fortnite/PUBG
#                                           Mobile/Free Fire
#                           fighting        Tekken/SF/MK/Guilty Gear
#                           rts             SC2, Age of Empires II
#                           ccg             Hearthstone (singleton — no other
#                                           card game tracked)
#                           sports          Rocket League (singleton —
#                                           vehicular sports, no other title
#                                           of this kind tracked)
#                           autobattler     Teamfight Tactics (singleton —
#                                           round-based auto-battler,
#                                           mechanically distinct from MOBA
#                                           despite sharing League's IP/
#                                           client; judgment call, see
#                                           collectors/liquipedia.py comment
#                                           header for a parallel case)
#                           arena_brawler   Brawl Stars (singleton — judgment
#                                           call: some sources describe it as
#                                           MOBA-adjacent, but its actual
#                                           esports format — short arcade
#                                           matches, multiple game modes, no
#                                           lanes/leveling — reads as
#                                           structurally different from the
#                                           moba entries above; flagged for
#                                           human review, could reasonably
#                                           move into moba instead)
#                         Five singleton genres is intentional, not a
#                         taxonomy failure: the brief's own framework treats
#                         a single-title niche-cell as a real (if ambiguous)
#                         analysis outcome, not something to paper over by
#                         forcing unrelated titles together.
#
#                         Platform taxonomy (revised 2026-09-05 — see below;
#                         the axis that matters here is which device(s) a
#                         title's PREMIER COMPETITIVE TIER actually runs on,
#                         not which devices the base game supports):
#                           pc              premier competitive tier is
#                                           PC-only, even when the base game
#                                           supports console/mobile play
#                                           (e.g. Overwatch: OWCS rules
#                                           permit PC only; Rainbow Six
#                                           Siege: every world championship
#                                           since 2017 has been PC-only).
#                                           Titles with a genuinely separate
#                                           mobile scene get split into their
#                                           own title_id instead (pubg vs.
#                                           pubg_mobile, league_of_legends vs.
#                                           wild_rift) and each half is
#                                           tagged pc/mobile independently —
#                                           platform is NOT 1:1 with genre
#                                           here.
#                           console         premier competitive tier is
#                                           console-only, or runs on one
#                                           tournament-organizer-provided
#                                           hardware standard rather than a
#                                           fragmented multi-platform pool
#                                           (Mortal Kombat: MK1 Pro
#                                           Kompetition is explicitly
#                                           PS5-exclusive; Tekken/Street
#                                           Fighter majors run offline on
#                                           one TO-provided setup, not
#                                           parallel per-platform circuits).
#                           pc_console      premier tier genuinely spans PC
#                                           and console in ONE unified
#                                           competition — not just "the base
#                                           game supports both" (Apex
#                                           Legends: PC/console share the
#                                           same ALGS lobbies, with
#                                           controller aim-assist tuned
#                                           specifically to keep it unified;
#                                           Fortnite: FNCS is PC+console in
#                                           one bracket, though Epic runs a
#                                           *separate* Fortnite Mobile
#                                           Series outside that bracket, so
#                                           mobile is excluded here; Guilty
#                                           Gear: ARC World Tour has both a
#                                           PS5 and a separate PC
#                                           qualification path feeding the
#                                           same Finals).
#                           mobile          mobile-only title, the mobile
#                                           half of a title already split
#                                           into its own title_id above, or
#                                           (judgment call, user override)
#                                           a PC+mobile title with one
#                                           unified client/ladder and no
#                                           separate title_id split
#                                           (Hearthstone, Teamfight Tactics).
#                         pc_mobile exists as a value in principle (same
#                         logic as pc_console, for a title whose premier
#                         tier genuinely spans PC+mobile in one unified
#                         competition) but no currently-tracked title uses
#                         it — Hearthstone/TFT were a judgment call toward
#                         mobile instead, above.
#
#                         Dropped the earlier single `cross_platform` catch-
#                         all (2026-09-05): it silently conflated different
#                         audience-pool compositions (a PC+console title and
#                         a PC+mobile title got the same tag), which
#                         undermines platform as a niche-defining axis
#                         (genre × platform × region, PRD §6) — the whole
#                         point is identifying a discrete competitive
#                         audience pool, and "cross_platform" didn't do
#                         that. Reclassifications below are verified online
#                         against each circuit's actual rules/format where
#                         possible (cited inline); several are medium
#                         confidence where explicit rule text couldn't be
#                         found — flagged inline, not asserted as fact.
#
# Region is deliberately NOT configured here — see PRD §6: region is measured
# from tournament data and broadcast-language mix, not set as a static tag.
#
# Twitch entries verified 2026-08-31 against the live Twitch API (Get Games /
# Search Categories). Liquipedia wiki slugs verified the same day against
# each wiki's action=query&meta=siteinfo — confirmed live, not guessed
# (the fighting-game titles share one combined "fighters" wiki, which isn't
# obvious in advance and was worth checking rather than assuming). Two
# Twitch picks are judgment calls, flagged inline: which Age of Empires
# entry, and which current-generation version of each fighting game to
# track. Verify/re-verify a Twitch category ID with:
#   python -c "
#   import os, httpx
#   token = httpx.post('https://id.twitch.tv/oauth2/token', params={
#       'client_id': os.environ['TWITCH_CLIENT_ID'],
#       'client_secret': os.environ['TWITCH_CLIENT_SECRET'],
#       'grant_type': 'client_credentials'}).json()['access_token']
#   r = httpx.get('https://api.twitch.tv/helix/search/categories',
#       params={'query': 'League of Legends'},
#       headers={'Client-Id': os.environ['TWITCH_CLIENT_ID'],
#                'Authorization': f'Bearer {token}'})
#   print(r.json())
#   "
#
# Adding a title is a config edit, not a code change.

