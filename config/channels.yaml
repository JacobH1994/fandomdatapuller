# Official broadcast channels per title (PRD §7).
#
# Two consumers:
#   - Tier 1 of the collector's capture policy (config/capture.yaml): any
#     stream from a channel listed here is captured at full detail on every
#     poll, regardless of viewer count.
#   - Later, the numerator for "% of category attention on official
#     channels" (PRD §6 is_official_broadcast, brief §7 limitation 4).
#
# Requires manual curation and periodic review — channels change between
# seasons. Empty for now; nothing has been curated yet, so Tier 1 currently
# matches nothing and every stream is classified by viewer count alone
# (Tier 2 / Tier 3). That's a safe default: it costs some storage
# efficiency until curated, not correctness.
#
# Match key is the Twitch login (lowercase, stable across display-name
# changes), not the display name shown on stream.
#
# Structure:
# channels:
#   <title_id from config/titles.yaml>:
#     - some_official_channel_login
#     - another_official_channel_login

channels:
  counter_strike:
    # Curated 2026-09-09 from research/other/notebooks/official_channel_candidates.ipynb's
    # draft (config/channels.draft.yaml), human-reviewed — not a blind
    # copy. Tournament organizers' own broadcast channels, kept distinct
    # from popular personality/co-stream channels the draft also surfaced
    # (chopperinho, shadowkekw, strogo, theburntpeanut, hypetried —
    # deliberately excluded: high viewer-time during a tournament window
    # is exactly what a co-stream looks like too, which broadcast_tier's
    # detected_costream already tracks separately; folding them in here
    # would blur that distinction, not sharpen it).
    - blastpremier  # BLAST Premier's own channel — tournament organizer
    - eslcs         # ESL's Counter-Strike channel — tournament organizer; corroborated by docs/eslchannelnames.txt (user-supplied, 2026-09-09)
    - eslcsb        # ESL's CS backup/secondary channel — docs/eslchannelnames.txt; live-verified against Twitch Helix (Get Users) 2026-09-09
    - betboom_cs_ru # BetBoom (real esports org) — user's call; unconfirmed whether this is an official-broadcast channel or a team channel, re-verify if it looks off

    # Added 2026-09-09, found via Twitch Helix search/channels for
    # "blast"/"pgl" (user's request — scan for BLAST/PGL-named channels),
    # live-verified to exist. Excludes obvious squatter/fan/bot accounts
    # from the same search (numbered suffixes, "bot"/"hd" suffixes, etc.)
    # without further checking those individually.
    - pgl_cs2              # PGL's CS2 channel — tournament organizer
    - pgl_cs2en2           # PGL's secondary English CS2 feed
    - pgl_csgoru           # PGL's Russian-language CS feed
    - blastpremier_cs2     # BLAST Premier's CS2-specific channel, distinct from blastpremier above
    - blastpremier_worldfeed # BLAST Premier world-feed channel

    # NOT added: "blast" and "pgl" (each org's general/multi-game
    # account — both run tournaments for other titles too, BLAST also
    # Rainbow Six, PGL also Dota2/PUBG/FIFA/Hearthstone). User asked
    # whether inclusion could be ringfenced to only when a stream's
    # title strongly indicates CS content — checked directly: this file
    # has no per-stream conditional, is_official_broadcast is set at
    # capture time purely from channel identity (collectors/
    # twitch_poll.py), so there's no way to make an entry here
    # conditional on title text. Per the user's own fallback instruction,
    # excluded rather than added unconditionally. Nothing is actually
    # lost by this: if either channel streams CS content whose title
    # names a known tournament, broadcast_tier's detected_costream
    # (etl/classify_broadcast_tier.py) already catches it independently
    # of channel identity — that's the title-text-conditional mechanism
    # the user was asking for, it just lives in a different place than
    # this file.

  dota2:
    # Added 2026-09-09 from docs/eslchannelnames.txt (user-supplied) — ESL
    # runs several parallel Dota 2 broadcast channels simultaneously
    # (regional/group-stage coverage), each named after real Dota 2
    # items/lore (Sange, Yasha's counterpart Clarity, Tango, Mango are all
    # actual in-game items — a deliberate ESL naming convention, not a
    # coincidence). All 11 logins in the source file live-verified to
    # exist against Twitch Helix (Get Users) before being added here — no
    # further check (e.g. follower count, partner status) performed
    # beyond that; revisit if any of these looks off in practice.
    - esl_dota2
    - esl_dota2earth
    - esl_dota2void
    - esl_dota2ember
    - esl_dota2storm
    - esl_dota2sange
    - esl_dota2clarity
    - esl_dota2tango
    - esl_dota2mango

    # Added 2026-09-09, PGL Dota2 feeds — same discovery method as the CS
    # pgl_cs2* entries above (Twitch Helix search, live-verified via Get
    # Users). Excludes pgldotaalpha/pgldotabeta (test/staging-named, not
    # broadcast feeds) and pgl_dota/pgl_dota3/pgl_dota_2/pgldota_2/
    # pgl_dota2_off (ambiguous, don't fit the clean main+language-feed
    # numbering pattern the rest of these do — same judgment call as
    # excluding CS's personality/co-stream candidates, flag for review
    # if any of these turns out to matter).
    - pgl_dota2     # main channel
    - pgl_dota2en1
    - pgl_dota2en2
    - pgl_dota2en3
    - pgl_dota2en4
    - pgl_dota2en5
    - pgl_dota2en6
    - pgl_dota2es1
    - pgl_dota2es2
    - pgl_dota2ru
    - pgl_dota2ru2
    - pgl_dota2ru3
    - pgl_dota2ru4

    # NOT added: no official BLAST Dota2 channel found. BLAST SLAM is a
    # real, confirmed multi-edition Dota2 tournament series (live-verified
    # directly in `tournaments`), but neither "blast dota" nor "blast slam"
    # Twitch searches turned up an obvious official channel — only noise
    # (blastdota/blastdotab exist but have no independent signal they're
    # actually BLAST's, unlike the PGL case above where scale and naming
    # directly parallel already-verified channels). Worth a different
    # search angle (BLAST's own site/socials) if this needs resolving
    # rather than guessed at.

  street_fighter:
    # Curated 2026-09-16, from config/channels.draft.yaml's ranked
    # candidates (research/other/notebooks/official_channel_candidates.ipynb),
    # live-verified via Twitch Helix (Get Users) — both channels' own bios
    # explicitly self-identify as Capcom's official channels, not inferred
    # from naming alone. Every other draft candidate for this title
    # (mistermv, akarindao, fps_shaka, naru0419045, kokujintv,
    # stylishnoob4) is a personal streamer/caster bio, correctly excluded.
    - capcomfighters    # Capcom's main channel — bio: "Home to all of your favorite Capcom fighting games... the number one destination to watch all Capcom Pro Tour and Street Fighter League events"
    - capcomfighters_jp # Capcom's Japanese-language channel — bio (JP): official channel operated by Capcom Co., Ltd. for Capcom Pro Tour / Street Fighter League esports content

    # NOT added: "streetfighterleague" exists but its bio self-identifies
    # as an unofficial Xbox 360-era fan community ("Check us o[ut]"), not
    # Capcom's own channel — a real, checked-not-guessed exclusion, not an
    # oversight (the name alone would have looked plausible).

  valorant:
    # Curated 2026-09-16, from config/channels.draft.yaml's ranked
    # candidates plus a live Twitch Helix search for VCT regional
    # siblings not captured in the draft's top-8-by-viewer-time cutoff
    # (the same discovery pattern already used for CS's PGL/BLAST feeds
    # and Dota2's ESL/PGL regional feeds). All three below are Twitch
    # `partner`/`affiliate` accounts with real follower counts and a bio
    # that explicitly self-identifies as the official VCT broadcast for
    # that region — not inferred from naming alone.
    - valorant_americas # Official VCT Americas broadcast — partner, 954K followers
    - valorant_emea     # Official VCT EMEA broadcast — partner, 793K followers
    - valorant_pacific  # Official VCT Pacific broadcast — affiliate, 468K followers

    # NOT added: vct_emea / vct_pacific / vct_americas all exist (same
    # naming pattern, would have looked equally plausible) but checked
    # and rejected — 1-5 followers each, no partner/affiliate status,
    # created 2023-03-23 (all three on the same day, consistent with a
    # squatted/decoy set) vs. the real channels' 2020 creation dates and
    # six-figure follower counts. A real, checked distinction, not a
    # guess. No VCT China channel found under any tried naming pattern —
    # not pursued further given China's own platform-access limitations
    # already documented elsewhere in this project (PRD §9.8).
    # Every other draft candidate (kato_junichi0817, gofns, s0mcs,
    # kant0211, assentw, itachi, supertf) is a personal player/caster
    # bio, correctly excluded.

  pubg:
    # Curated 2026-09-16, from config/channels.draft.yaml's ranked
    # candidates plus a live Twitch Helix search for regional siblings
    # (same method as valorant above). Only one real official channel
    # found — PUBG's esports broadcast structure does not appear to run
    # separate regional Twitch channels the way VALORANT's does.
    - pubg_battlegrounds # Official PUBG channel — partner, 1.22M followers, bio references a live PUBG EMEA Championship broadcast window

    # NOT added: pubgesports / pubg_esports / pubg_global all exist (same
    # plausible-looking naming) but checked and rejected — 2-20 followers
    # each, no partner/affiliate status, empty bios. Every other draft
    # candidate (kato_junichi0817, recrent, chocotaco, tgltn,
    # indegnasen0706, hibako, hollywoodbob) is a personal streamer bio,
    # several with talent-agency business-contact emails — correctly
    # excluded.
