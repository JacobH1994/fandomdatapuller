# Official broadcast channels per title (PRD §7).
#
# Two consumers:
#   - Tier 1 of the collector's capture policy (config/capture.yaml): any
#     stream from a channel listed here is captured at full detail on every
#     poll, regardless of viewer count.
#   - Later, the numerator for "% of category attention on official
#     channels" (PRD §6 is_official_broadcast, brief §7 limitation 4).
#
# Requires manual curation and periodic review — channels change between
# seasons. Empty for now; nothing has been curated yet, so Tier 1 currently
# matches nothing and every stream is classified by viewer count alone
# (Tier 2 / Tier 3). That's a safe default: it costs some storage
# efficiency until curated, not correctness.
#
# Match key is the Twitch login (lowercase, stable across display-name
# changes), not the display name shown on stream.
#
# Structure:
# channels:
#   <title_id from config/titles.yaml>:
#     - some_official_channel_login
#     - another_official_channel_login

channels:
  counter_strike:
    # Curated 2026-09-09 from notebooks/official_channel_candidates.ipynb's
    # draft (config/channels.draft.yaml), human-reviewed — not a blind
    # copy. Tournament organizers' own broadcast channels, kept distinct
    # from popular personality/co-stream channels the draft also surfaced
    # (chopperinho, shadowkekw, strogo, theburntpeanut, hypetried —
    # deliberately excluded: high viewer-time during a tournament window
    # is exactly what a co-stream looks like too, which broadcast_tier's
    # detected_costream already tracks separately; folding them in here
    # would blur that distinction, not sharpen it).
    - blastpremier  # BLAST Premier's own channel — tournament organizer
    - eslcs         # ESL's Counter-Strike channel — tournament organizer
    - betboom_cs_ru # BetBoom (real esports org) — user's call; unconfirmed whether this is an official-broadcast channel or a team channel, re-verify if it looks off
